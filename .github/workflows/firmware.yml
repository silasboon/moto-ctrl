name: firmware

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firmware-build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build

  sim-build-test:
    name: Host simulator build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firmware/sim/itest/package-lock.json

      - name: Configure
        run: cmake -S firmware/sim -B firmware/sim/build

      - name: Build
        run: cmake --build firmware/sim/build

      - name: Unit tests (ctest)
        run: ctest --test-dir firmware/sim/build --output-on-failure

      - name: Integration tests (WebSocket + Ed25519 interop)
        working-directory: firmware/sim/itest
        run: |
          npm ci
          npm test
